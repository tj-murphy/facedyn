name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install facedyn (dev + viz extras)
        run: pip install -e ".[dev,viz]"

      - name: Run tests
        run: pytest -v

  core-import:
    name: Core import (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install facedyn (no extras)
        run: pip install -e .

      - name: Import every submodule without matplotlib or rpy2 installed
        run: |
          python -c "
          import facedyn
          import facedyn.au_labels
          import facedyn.features
          import facedyn.features.external
          import facedyn.features.reshape
          import facedyn.features.timeseries
          import facedyn.nmf
          import facedyn.normalisation
          import facedyn.representative_aus
          import facedyn.smoothing
          import facedyn.splitting
          print('facedyn core imports cleanly with no optional dependencies')
          "
