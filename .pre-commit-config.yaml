# Run on every commit after `pre-commit install`; run on everything with
# `pre-commit run --all-files`. Hooks that modify files come before hooks
# that only check. Bump the pinned revisions with `pre-commit autoupdate`.
# The R-validation fixtures are reference output and stay byte-for-byte.
exclude: ^tests/validation/fixtures/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # conftest.py is pytest configuration, not a test module.
        exclude: ^tests/conftest\.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff version in the `lint` dependency group.
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes"]
      - id: ruff-format
