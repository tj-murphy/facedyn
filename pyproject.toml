[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facedyn"
version = "1.0.0"
description = "Interpretable, leakage-aware classification of facial action unit time series."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timothy Murphy" }]
keywords = [
    "facial action units",
    "facial expression",
    "affective computing",
    "time series",
    "OpenFace",
    "classification",
    "cross-validation",
    "feature selection",
    "interpretability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.2",
    "threadpoolctl>=3.1",
]

[project.urls]
Homepage = "https://github.com/tj-murphy/facedyn"
Documentation = "https://github.com/tj-murphy/facedyn#readme"
Issues = "https://github.com/tj-murphy/facedyn/issues"
Changelog = "https://github.com/tj-murphy/facedyn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
viz = [
    "matplotlib>=3.7",
]
# Optional: lets facedyn.features.external.RFeatureExtractor call R feature
# packages (cmfts, tsfeatures, ...). Also needs a working R installation with
# the target package -- facedyn's core never imports rpy2.
# NB rpy2 must match your R: 3.6+ links against R >= 4.5 and fails at import
# on older R with a cffi symbol error. Pin `rpy2<3.6` on R 4.4 or earlier.
r = [
    "rpy2>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/facedyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
