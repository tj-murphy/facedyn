[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facedyn"
version = "1.0.0"
description = "Interpretable facial-dynamics pipeline for deepfake detection (Python port of the Paper 1 R analysis)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Timothy Murphy" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.2",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
viz = [
    "matplotlib>=3.7",
]
# Optional: lets facedyn.features.external.RFeatureExtractor call R feature
# packages (cmfts, tsfeatures, ...). Also needs a working R installation with
# the target package -- facedyn's core never imports rpy2.
# NB rpy2 must match your R: 3.6+ links against R >= 4.5 and fails at import
# on older R with a cffi symbol error. Pin `rpy2<3.6` on R 4.4 or earlier.
r = [
    "rpy2>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/facedyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
